# Example user ruleset. Copy to <config dir>/rules.d/ and edit.
# Keep real internal names in your own copy, not in this repository.
#
# Rule IDs are addressed as "<ruleset id>:<rule id>", e.g. "example/org:hosts",
# in `rulesets.enable` / `rulesets.disable`.

id: example/org
description: Names specific to an organisation.
# default: true                      # set false to ship it disabled

rules:
  # Literal values, listed inline or in a file (one per line, # comments).
  - id: hosts
    kind: HOST
    values:
      - db.internal.example
    # values_file: hosts.txt         # relative to this file
    case_insensitive: true

  # A regular expression (RE2). `group` masks one capture group only.
  - id: ticket_secret
    kind: SECRET
    description: Value after "deploy-token:".
    pattern: 'deploy-token:\s*([A-Za-z0-9]{16,})'
    group: 1
    # Values matching any allow pattern are not masked.
    allow:
      - '^0+$'

  # Field names. The whole value of a field with one of these names is
  # masked, in JSON, YAML, logfmt, env and code alike. Names match however
  # they are spelled: customerCode, customer_code, CUSTOMER-CODE.
  - id: customer_code
    kind: CUSTOMER
    keys: [customer_code, account_holder]

  # A rule can be defined but left off, and enabled later from config.yaml
  # with `rulesets.enable: [example/org:member_number]`.
  # `validators` adds named checks a regexp cannot express (available: luhn).
  - id: member_number
    kind: MEMBER_ID
    pattern: '\bM-\d{12}\b'
    enabled: false

  # Tiers: the value is still masked, but the label of the first tier it
  # falls into is added to the kind, so the model sees the range or class
  # (__LLMSP_SALARY_3M_6M_...__) and not the value. Tiers are tried in order.
  #
  # Amounts with many possible values: `below` / `at_least` (or both, for a
  # range), written as 3000000, 300万, 3M or ¥3,000,000. A value is read as an
  # amount with , separators, a currency sign or code, k / M / B suffixes and
  # 千 / 万 / 億 units. A value that is not an amount (非公開) falls through to
  # the next tier; if none takes it, it is masked with the plain kind.
  - id: salary
    kind: SALARY
    keys: [salary, annual_income, base_pay, 年収, 給与]
    tiers:
      - {label: under_3m, below: 300万}
      - {label: 3m_6m, below: 600万}
      - {label: 6m_10m, below: 1000万}
      - {label: 10m_plus, at_least: 1000万}
    enabled: false

  # Values with few possible choices: group them with `values` (exact, case
  # and surrounding spaces ignored) or `match` (RE2). A tier with no
  # condition takes everything else and must come last.
  - id: disability
    kind: DISABILITY
    keys: [disability_grade, 障害等級]
    tiers:
      - {label: severe, values: [1級, 2級]}
      - {label: moderate, match: '^[3-4]級$'}
      - {label: other}
    enabled: false

  # Modes: how a match is masked.
  #   restore      (default) placeholder, stored locally, restored in replies
  #   redact       replaced by [REDACTED:<KIND>:*1234:<tag>]; never stored or
  #                restored. keep_first / keep_last show up to 10 letters and
  #                digits from the ends (only when the value is more than
  #                twice that long). For values the agent must never get back.
  #   approximate  placeholder with the amount rounded into the kind
  #                (__LLMSP_SALARY_ABOUT_4500K_...__), restored like restore.
  #                digits: significant digits, default 2.
  - id: bank_account
    kind: BANK_ACCOUNT
    keys: [account_number, 口座番号]
    mode: redact
    keep_last: 3
    enabled: false

  - id: bonus
    kind: BONUS
    keys: [bonus, 賞与]
    mode: approximate
    digits: 2
    enabled: false
