id: builtin/credentials
description: API keys, tokens and private keys with a recognisable format.

rules:
  - id: private_key
    kind: PRIVATE_KEY
    description: PEM private key block (complete BEGIN ... END only).
    pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z0-9 ]*PRIVATE KEY-----'

  - id: aws_access_key_id
    kind: AWS_ACCESS_KEY
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: aws_secret_access_key
    kind: AWS_SECRET_KEY
    description: 40-character secret near the words "aws" and "secret".
    pattern: '(?i)aws.{0,30}?(?:secret|sk).{0,20}?[\s''"=:]([A-Za-z0-9/+]{40})(?:[^A-Za-z0-9/+]|$)'
    group: 1

  - id: github_token
    kind: GITHUB_TOKEN
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b'

  - id: slack_token
    kind: SLACK_TOKEN
    pattern: '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'

  - id: slack_webhook
    kind: SLACK_WEBHOOK
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9/_-]+'

  - id: anthropic_api_key
    kind: ANTHROPIC_KEY
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}'

  - id: openai_api_key
    kind: OPENAI_KEY
    pattern: '\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{32,}'
    allow:
      - '^sk-ant-'

  - id: google_api_key
    kind: GOOGLE_API_KEY
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'

  - id: jwt
    kind: JWT
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
