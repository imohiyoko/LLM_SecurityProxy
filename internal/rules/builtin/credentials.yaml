id: builtin/credentials
description: API keys, tokens and private keys with a recognisable format.

rules:
  - id: private_key
    kind: PRIVATE_KEY
    description: PEM or PGP armored private key block (complete BEGIN ... END only).
    pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY(?: BLOCK)?-----[\s\S]*?-----END [A-Z0-9 ]*PRIVATE KEY(?: BLOCK)?-----'

  - id: aws_access_key_id
    kind: AWS_ACCESS_KEY
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: aws_secret_access_key
    kind: AWS_SECRET_KEY
    description: 40-character secret near the words "aws" and "secret".
    pattern: '(?i)aws.{0,30}?(?:secret|sk).{0,20}?[\s''"=:]([A-Za-z0-9/+]{40})(?:[^A-Za-z0-9/+]|$)'
    group: 1

  - id: github_token
    kind: GITHUB_TOKEN
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b'

  - id: slack_token
    kind: SLACK_TOKEN
    description: Bot / user tokens (xox?-) and app-level tokens (xapp-).
    pattern: '\b(?:xox[abposr]-[A-Za-z0-9-]{10,}|xapp-\d-[A-Za-z0-9-]{10,})\b'

  - id: slack_webhook
    kind: SLACK_WEBHOOK
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9/_-]+'

  - id: url_credentials
    kind: SECRET
    description: >
      Password in the userinfo of a URL (scheme://user:password@host), as in
      database and cache connection strings. Only the password is masked.
      An unencoded @ or / in the password is kept in it: the password runs
      to the last @ before the host, and contains a / only if no shorter
      reading fits.
    pattern: '\b[A-Za-z][A-Za-z0-9+.-]*://[^\s:/@"''<>]*:([^\s/@"''<>]+(?:@[^\s/@"''<>]+)*|[^\s@"''<>]+(?:@[^\s@"''<>]+)*)@[^\s@/?#"''<>]*(?:[\s/?#"''<>]|$)'
    group: 1
    allow:
      - '__LLMSP_'                                                     # already masked
      - '^\d{1,5}/'                                                     # https://host:8443/path@x (port, not password)
      - '^\$\{[^}]*\}$|^\$[A-Za-z_][A-Za-z0-9_]*$|^\{\{.*\}\}$|^%[A-Za-z_][A-Za-z0-9_]*%$' # ${DB_PASS}, $PASS, {{ pass }}, %PASS%
      - '(?i)^(?:x+|\*+|\.+|<[^>]*>|\[[^\]]*\]|pass|passwd|password|pwd|secret|changeme|placeholder|redacted|your[_-].*)$'

  - id: stripe_key
    kind: STRIPE_KEY
    pattern: '\b[rs]k_live_[A-Za-z0-9]{20,}\b'

  - id: gitlab_token
    kind: GITLAB_TOKEN
    pattern: '\bglpat-[A-Za-z0-9_-]{20,}\b'

  - id: npm_token
    kind: NPM_TOKEN
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'

  - id: anthropic_api_key
    kind: ANTHROPIC_KEY
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}'

  - id: openai_api_key
    kind: OPENAI_KEY
    pattern: '\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{32,}'
    allow:
      - '^sk-ant-'

  - id: google_api_key
    kind: GOOGLE_API_KEY
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'

  - id: jwt
    kind: JWT
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
