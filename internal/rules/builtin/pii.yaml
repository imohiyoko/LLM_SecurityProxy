id: builtin/pii
description: Personal data with a recognisable format.

rules:
  - id: email
    kind: EMAIL
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}\b'
    allow:
      - '(?i)\.(?:png|jpe?g|gif|webp|svg|ico|avif)$'   # icon@2x.png
      - '(?i)^git@'                                   # git@host:org/repo
      - '(?i)@(?:[^@]+\.)?example\.(?:com|org|net|jp)$'
      - '(?i)@(?:[^@]+\.)?users\.noreply\.github\.com$'
      - '(?i)\.(?:example|invalid|test|localhost)$'

  - id: credit_card
    kind: CREDIT_CARD
    # 13-19 digits, contiguous or grouped 4-4-4-x or 4-6-x (Amex, Diners),
    # each separator a space or a hyphen. Each layout has a fixed number of
    # groups so that a trailing expiry or CVV ("<card> 12/29", "<card> 123")
    # is not absorbed: the longer match would fail luhn and the card would not
    # be masked at all. luhn checks the length and the checksum.
    pattern: '\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|3[47]\d{2}|35\d{2}|6011|65\d{2}|30[0-5]\d|3[689]\d{2})(?:\d{9,15}|(?:[ -]\d{4}){2}[ -]\d{1,7}|[ -]\d{6}[ -]\d{3,9})\b'
    validators: [luhn]

  - id: credit_card_19
    kind: CREDIT_CARD
    # 19 digits grouped 4-4-4-4-3. Kept apart from credit_card, which reads
    # the first 16 of them as a card: the two layouts cannot be told apart
    # from "<16-digit card> <CVV>" by pattern, so each is checked by luhn on
    # its own and the longer valid match wins.
    pattern: '\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|35\d{2}|6011|65\d{2})(?:[ -]\d{4}){3}[ -]\d{3}\b'
    validators: [luhn]

  - id: name
    kind: NAME
    description: >
      Whole value of a field that holds a person's name, in JSON, YAML,
      logfmt, env, code, XML and logs (userName: ..., "display_name": "...",
      FULL_NAME='...', Full Name: ...), quoted values with spaces included.
      The field name must be one of the keys once normalised, with or without
      word breaks (userName = user_name = USERNAME); a longer name
      (billing_user_name) or a bare name / user / login does not match. Add
      your own field names with a `keys:` rule.
    keys:
      - user_name
      - full_name
      - display_name
      - first_name
      - last_name
      - middle_name
      - family_name
      - given_name
      - nickname
      - real_name
      - first_name_kana
      - last_name_kana
      - full_name_kana
      - customer_name
      - contact_name
      - employee_name
      - author_name
      - 氏名
    # Each entry matches the whole value. Calls, templates, expressions and
    # type annotations are already skipped by the field scanner.
    allow:
      - '^__LLMSP_[A-Z0-9_]{1,32}?_[0-9a-f]{12}__$'                           # already masked
      - '^[^\pL]*$'                                                          # no letters: ids, dates, "-"
      # Placeholder words and system or service accounts. Lower case (and the
      # usual spellings of constants) only, so Root, Guest or Test as a name
      # is still masked.
      - '^(?:true|false|True|False|TRUE|FALSE|yes|no|null|Null|NULL|nil|None|none|undefined|unknown|n/?a|N/?A|tbd|TBD|empty|anonymous|anon|guest|admin|administrator|root|system|test|user|username|Username|name|default|nobody|me|postgres|mysql|ubuntu|ec2-user|www-data|nginx|git|jenkins|runner|deploy)$'
      # A reference to another field, not a name: first_name, user.name,
      # $userName, currentUser. It must contain name or user and have the
      # shape of an identifier (a separator or a camelCase hump), so that
      # Hauser or Namekawa is still masked.
      - '^(?:[\w$@:>-]*[_.$@:>-][\w.$@:>-]*(?i:name|user)[\w.$@:>-]*|[\w.$@:>-]*(?i:name|user)[\w.$@:>-]*[_.$@:>-][\w.$@:>-]*|[a-z]\w*(?:Name|User)\w*|(?:name|user)[A-Z]\w*)$'
      - '^(?:[$#]\{.*\}|\{\{.*\}\}|%\([\w.]+\)[sdr])$'                        # a quoted template: "{{ .Name }}", "${NAME}"
      - '^(?:str|string|String|int|integer|bool|boolean|any|object|text|char|varchar|nvarchar)(?:\(\d+\)|\[\]|\?)?$' # a quoted type name
      - '(?i)^(?:x+|\*+|\.+|<[^>]*>|\[[^\]]*\]|changeme|placeholder|redacted|your[_ -].*)$'
