id: builtin/pii
description: Personal data with a recognisable format.

rules:
  - id: email
    kind: EMAIL
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}\b'
    allow:
      - '(?i)\.(?:png|jpe?g|gif|webp|svg|ico|avif)$'   # icon@2x.png
      - '(?i)^git@'                                   # git@host:org/repo
      - '(?i)@(?:[^@]+\.)?example\.(?:com|org|net|jp)$'
      - '(?i)@(?:[^@]+\.)?users\.noreply\.github\.com$'
      - '(?i)\.(?:example|invalid|test|localhost)$'

  - id: credit_card
    kind: CREDIT_CARD
    # 13-19 digits, contiguous or grouped 4-4-4-x or 4-6-x (Amex, Diners),
    # each separator a space or a hyphen. Each layout has a fixed number of
    # groups so that a trailing expiry or CVV ("<card> 12/29", "<card> 123")
    # is not absorbed: the longer match would fail luhn and the card would not
    # be masked at all. luhn checks the length and the checksum.
    pattern: '\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|3[47]\d{2}|35\d{2}|6011|65\d{2}|30[0-5]\d|3[689]\d{2})(?:\d{9,15}|(?:[ -]\d{4}){2}[ -]\d{1,7}|[ -]\d{6}[ -]\d{3,9})\b'
    validators: [luhn]

  - id: credit_card_19
    kind: CREDIT_CARD
    # 19 digits grouped 4-4-4-4-3. Kept apart from credit_card, which reads
    # the first 16 of them as a card: the two layouts cannot be told apart
    # from "<16-digit card> <CVV>" by pattern, so each is checked by luhn on
    # its own and the longer valid match wins.
    pattern: '\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|35\d{2}|6011|65\d{2})(?:[ -]\d{4}){3}[ -]\d{3}\b'
    validators: [luhn]

  - id: name
    kind: NAME
    description: >
      Whole value of a field that holds a person's name, in JSON, YAML,
      logfmt, env, code and logs (userName: ..., "display_name": "...",
      FULL_NAME='...'), quoted values with spaces included. The field name
      must be one of the keys once normalised (userName = user_name =
      USER-NAME); a longer name (billing_user_name) or a bare name / user /
      login does not match. Add your own field names with a `keys:` rule.
    keys:
      - user_name
      - username
      - full_name
      - fullname
      - display_name
      - first_name
      - firstname
      - last_name
      - lastname
      - middle_name
      - family_name
      - given_name
      - nickname
      - nick_name
      - real_name
      - first_name_kana
      - last_name_kana
      - full_name_kana
      - customer_name
      - contact_name
      - employee_name
      - author_name
    # Each entry matches the whole value.
    allow:
      - '__LLMSP_'                                                           # already masked
      - '^[^\pL]*$'                                                          # no letters: ids, dates, "-"
      - '(?i)^(?:true|false|yes|no|null|nil|none|undefined|unknown|n/?a|tbd|empty|anonymous|anon|guest|admin|administrator|root|system|test|user|default|nobody|me)$'
      - '(?i)^[\w.$@:>-]*(?:name|user)[\w.$@:>-]*$'                           # a reference, not a name: first_name, user.name, $userName
      - '(?i)^(?:str|string|int|integer|bool|boolean|any|object|text|char|varchar|nvarchar)(?:\(\d+\)|\[\]|\?)?$' # type annotation
      - '^[A-Za-z_$][\w$.]*[(\[]'                                             # call or index: getName(), Optional[str
      - '^(?:[$#]\{|\{\{|\{[A-Za-z_][\w.]*\}$|%\([\w.]+\)[sdr]$|\$[A-Za-z_]\w*$)' # ${X}, #{x}, {{ .Name }}, {name}, %(name)s, $X
      - '(?i)^(?:x+|\*+|\.+|<[^>]*>|\[[^\]]*\]|changeme|placeholder|redacted|your[_ -].*)$'
