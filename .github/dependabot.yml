version: 2
updates:
  # Wait a week before proposing a newly published version: a compromised or
  # broken release is usually caught and yanked within days.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
