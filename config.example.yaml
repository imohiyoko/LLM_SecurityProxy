# Copy to the config directory and edit:
#   macOS: ~/Library/Application Support/llmsp/config.yaml
#   Linux: ~/.config/llmsp/config.yaml
# Keep environment-specific values in that file, not in this repository.

listen: 127.0.0.1:8787

upstream:
  base_url: https://api.anthropic.com
  # HTTP(S) proxy for outbound traffic. Empty: use HTTPS_PROXY / HTTP_PROXY.
  proxy: ""                        # e.g. http://proxy.example.internal:8080
  # Extra CA certificates (PEM) for TLS-inspecting proxies.
  ca_file: ""                      # e.g. ~/certs/proxy-ca.pem
  # Headers that carry the API credential; forwarded unmasked. Every other
  # header value, and the query string, is masked like the request body.
  auth_headers: [Authorization, X-Api-Key]

# Profiles: one listener per client, each with its own upstream. Point each
# client at its own port. Unset upstream fields and inject_notice fall back to
# the top-level ones above. With profiles, remove the top-level `listen`.
# All profiles share one key and database. A profile's rulesets.enable /
# disable override the top-level ones for the IDs they name; its allowlist is
# added to the top-level one.
# profiles:
#   claude:                        # ANTHROPIC_BASE_URL=http://127.0.0.1:8787
#     listen: 127.0.0.1:8787
#   codex:                         # base_url = "http://127.0.0.1:8788"
#     listen: 127.0.0.1:8788
#     upstream:
#       base_url: https://api.openai.com/v1
#       auth_headers: [Authorization]
#   cline:
#     listen: 127.0.0.1:8789
#     upstream:
#       base_url: https://llm-gateway.example.internal
#     rulesets:
#       enable: [builtin/network]  # mask IPv4 addresses for this client only

# Routes: one port for every client instead, choosing the profile per request
# (first match wins; no match uses the top-level settings). Keep the top-level
# `listen`; profiles reached only through routes need no listen.
# routes:
#   - client: claude-code          # also codex, cline
#     profile: claude
#   - header: {X-Llmsp-Profile: '^strict$'}
#     profile: strict
#   - path_prefix: /cline          # base URL http://127.0.0.1:8787/cline
#     profile: cline
# A profile may also stand in for stricter ones for a while, with
# `llmsp relax [-for 2h] NAME`; the duration is limited per profile:
#   loose:
#     relax:
#       replaces: [claude, default]
#       default: 1h
#       max: 8h

# Where master.key and llmsp.db live. Default: the directory of this file.
# data_dir: ~/.local/share/llmsp

# Tell the model how placeholders work (appended to the system prompt).
inject_notice: true

# Detection rules come in rulesets. Built-in rulesets:
#   builtin/credentials  API keys, tokens, private keys        (on)
#   builtin/pii          e-mail addresses, card numbers        (on)
#   builtin/generic      password= / api_key: assignments      (on)
#   builtin/network      IPv4 addresses                        (off)
# Your own rulesets are read from rules.d/ next to this file, plus `dirs`.
# A ruleset file with the same id as a built-in one replaces it.
# Run `llmsp rules list` to see every rule and its state, and
# `llmsp rules test FILE` to see what would be masked.
rulesets:
  dirs: []                         # e.g. [~/src/my-private-rules]
  enable: []                       # ruleset or rule ids, e.g. [builtin/network]
  disable: []                      # e.g. [builtin/pii:email]; disable wins

# Regular expressions; matching values are never masked, whatever rule matched.
allowlist:
  - '@users\.noreply\.github\.com$'
